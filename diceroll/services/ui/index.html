<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice Roll Microservice</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <h1>Dice Roll Microservice</h1>
      <p class="subtitle">Roll the dice and view history persisted to a JSON log on Blob storage.</p>

      <section class="panel">
        <h2>Roll</h2>
        <div class="row">
          <label for="rolledBy">Rolled by</label>
          <input id="rolledBy" type="text" placeholder="Enter your name" maxlength="200" />
        </div>
        <div class="row">
          <label for="count">Number of dice</label>
          <input id="count" type="number" min="1" max="20" value="2" />
          <label for="sides">Sides</label>
          <input id="sides" type="number" min="2" max="100" value="6" />
          <button id="rollBtn">Roll</button>
        </div>
        <pre id="result">No roll yet.</pre>
      </section>

      <section class="panel">
        <div class="header-row">
          <h2>Recent Rolls</h2>
          <button id="refreshBtn">Refresh</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Rolled By</th>
              <th>Rolled At (UTC)</th>
              <th>Dice</th>
              <th>Rolls</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
