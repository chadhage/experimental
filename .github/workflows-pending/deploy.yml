name: deploy

# Builds + pushes images to GHCR, then runs terraform apply for the chosen environment.
# Trigger manually and pick the option/tier; secrets supply cloud credentials.

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Environment tier"
        type: choice
        options: [shared, isolated, byo]
        default: shared
      cloud:
        description: "Target cloud (byo only)"
        type: choice
        options: [azure, aws, gcp]
        default: azure

permissions:
  contents: read
  packages: write
  id-token: write # OIDC for cloud auth

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: apps/designer-web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ inputs.tier }}
    steps:
      - uses: actions/checkout@v4

      # Azure OIDC login (shared, isolated, or byo+azure)
      - name: Azure login
        if: inputs.tier != 'byo' || inputs.cloud == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # AWS OIDC (byo + aws)
      - name: AWS credentials
        if: inputs.tier == 'byo' && inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # GCP OIDC (byo + gcp)
      - name: GCP auth
        if: inputs.tier == 'byo' && inputs.cloud == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform apply
        working-directory: infra/environments/${{ inputs.tier }}
        run: |
          terraform init
          terraform apply -auto-approve \
            -var "cloud=${{ inputs.cloud }}" \
            -var "api_image=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}" \
            -var "web_image=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}"

      - name: Outputs
        working-directory: infra/environments/${{ inputs.tier }}
        run: terraform output
